[project]
name = "agent-control-adapters-workspace"
version = "0.1.0"
description = "Development workspace for independently packaged agent control adapters"
requires-python = ">=3.11,<3.14"
dependencies = ["agent-control-crewai"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.workspace]
members = ["python/packages/core", "python/packages/crewai"]
exclude = [
    "python/packages/google-adk",
    "python/packages/langchain",
    "python/packages/langgraph",
    "python/packages/openai-agents",
    "python/packages/maf",
]

[tool.uv.sources]
agent-control-adapters = { workspace = true }
agent-control-crewai = { workspace = true }

[dependency-groups]
acs = ["agent-control-spec==0.4.0a4"]
dev = [
    "bandit>=1.8,<2",
    "build>=1.2,<2",
    "httpx>=0.28,<0.29",
    "openai>=2.30,<3",
    "pip-audit>=2.9,<3",
    "pyright>=1.1.400,<2",
    "pytest>=8.3,<10",
    "ruff>=0.15,<0.16",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = [
    "python/packages/core/src",
    "python/packages/core/tests",
    "python/packages/crewai/src",
    "examples/crewai",
    "tests/agent_adapter_conformance.py",
    "tests/test_publication_metadata.py",
]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["python/packages/core/tests", "python/packages/crewai/tests", "tests"]
pythonpath = ["."]
addopts = "-ra -p no:agent_hooks_ctk"
markers = [
    "acs: requires the optional native ACS runtime and real policy engine",
    "e2e: requires the operator-managed local Ollama model",
]
